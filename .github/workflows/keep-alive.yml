name: Keep alive

# Render's free tier stops the instance after 15 idle minutes, and the next
# visitor waits ~30-60s for it to boot. The API's own heartbeat cannot help
# there: once the platform has stopped the process, nothing inside it runs. An
# external request is the only thing that both prevents the idle-out and wakes
# a stopped instance, so this pings the health endpoint from GitHub's runners.
#
# Scheduled workflows are queued, not exact - a */10 cron often fires a few
# minutes late, which is why the interval sits well under the 15-minute window.
#
# Targets this repository's own deployment by default, so nothing has to be
# configured for it to work. Set the repository variable KEEP_ALIVE_URL to point
# somewhere else (a rename, a custom domain, a staging service).
#
# The job only runs on the upstream repository: a fork must not send its
# scheduled traffic to somebody else's service, and GitHub keeps schedules
# enabled on forks.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping API
    if: github.repository == 'syedmukheeth/SAM-Compiler'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || 'https://sam-compiler.onrender.com/api/health' }}
        run: |
          set -u
          if [ -z "${KEEP_ALIVE_URL}" ]; then
            echo "KEEP_ALIVE_URL is empty; nothing to ping."
            exit 0
          fi
          echo "Pinging ${KEEP_ALIVE_URL}"

          # A cold instance can take ~60s to answer, so allow a long timeout and
          # a couple of retries before calling it a failure.
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "${KEEP_ALIVE_URL}" || echo "000")
            echo "Attempt ${attempt}: HTTP ${status}"
            if [ "${status}" = "200" ]; then
              echo "Instance is awake."
              exit 0
            fi
            sleep 15
          done

          echo "::warning::${KEEP_ALIVE_URL} did not return 200 after 3 attempts (last status ${status})."
          exit 1
