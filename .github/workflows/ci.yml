name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # config/env.js validates at import time, so anything that loads the API
  # needs these present. They are throwaway values, not secrets.
  JWT_SECRET: ci_jwt_secret_that_is_definitely_over_32_chars
  GEMINI_API_KEY: ci-placeholder-key
  MONGO_URI: mongodb://127.0.0.1:27017/sam_ci
  REDIS_URL: redis://127.0.0.1:6379
  WEB_ORIGIN: http://localhost:5174

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # mongodb-memory-server downloads a mongod binary on first use; caching it
      # keeps subsequent runs from re-fetching ~600MB.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm test
